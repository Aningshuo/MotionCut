<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'">
<title>MotionCut</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0b0c; color: #e8e8ea; font: 14px/1.5 -apple-system, "PingFang SC", system-ui, sans-serif; }
  main { padding: 32px 40px; max-width: 720px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
  p { margin: 6px 0; color: #a0a0a6; }
  code { color: #d7d7dc; background: #17171a; padding: 1px 6px; border-radius: 4px; }
  #status[data-state="ok"] { color: #62d18b; }
  #status[data-state="down"] { color: #f07a6a; }
</style>
</head>
<body>
<main>
  <h1>MotionCut</h1>
  <p><strong>UI 未构建</strong>：这是回退状态页。运行 <code>pnpm build:ui</code> 后刷新，Studio 会直接提供构建产物。</p>
  <p id="status" data-state="pending">正在检查 Studio…</p>
  <p id="detail"></p>
  <p>壳能力探测：<code id="caps">…</code></p>
</main>
<script type="module">
  const bridge = window.opencut ?? null;
  const probe = {
    require: typeof require,
    process: typeof process,
    opencut: bridge === null ? null : Object.keys(bridge).sort(),
  };
  window.__opencutProbe = probe;
  document.getElementById('caps').textContent = JSON.stringify(probe);

  const status = document.getElementById('status');
  const detail = document.getElementById('detail');
  if (bridge === null) {
    status.dataset.state = 'down';
    status.textContent = 'preload 桥缺失：window.opencut 不存在';
  } else {
    try {
      const health = await bridge.health();
      window.__opencutHealth = health;
      if (health !== null && health.ok === true) {
        status.dataset.state = 'ok';
        status.textContent = `Studio 在线 · pid ${health.pid} · v${health.version}`;
      } else {
        status.dataset.state = 'down';
        status.textContent = `Studio 不可用：${health === null ? 'null' : health.code ?? 'unknown'}`;
      }
    } catch (error) {
      window.__opencutHealth = { ok: false, code: 'BRIDGE_ERROR', message: String(error) };
      status.dataset.state = 'down';
      status.textContent = `桥调用失败：${String(error)}`;
      detail.textContent = '不假装可用：窗口留着，但状态显示为失败。';
    }
    bridge.onEvent((event) => {
      detail.textContent = `最近事件：${JSON.stringify(event)}`;
    });
  }
</script>
</body>
</html>
