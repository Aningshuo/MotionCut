<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<title>P54 透明度夹具（网页片段）</title>
<style>
  /* 透明导出（P31）：舞台页只把**它自己**那三层刷透明，film.html 里的底色要自己拆。
     写成 #000 的话 omitBackground 也救不回来 —— 实测角落 alpha=255、RGB=0。 */
  html, body { margin: 0; height: 100%; background: transparent; }
  section { position: relative; display: block; width: 1280px; height: 720px; background: transparent; }
  iframe { position: absolute; border: 0; left: 0; top: 0; background: transparent; }
</style>
</head>
<body>
<section id="stage">
  <iframe id="page" src="page.html#t=0,0.5" at="0" size="1280x720" style="left: 0px; top: 0px; width: 1280px; height: 720px"></iframe>
</section>
</body>
</html>
