<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>M33 场景：把一个只由 --motion-t 驱动的模板挂成实例</title>
<!--
  结构与副线1 的 tests/fixtures/scenes/motion-film-badge.html 一致：
  实例根是那个 iframe（data-instance + at），模板文档里的动画只看 --motion-t。

  场景自己不含任何动效逻辑——相位完全由舞台每帧写进来的 --motion-t 决定。
  这也是 M33 的关键：预览与导出走同一段舞台运行时，所以相位一致。
-->
<style>
  html, body { margin: 0; padding: 0; background: #0b1020; }
  section { position: relative; display: block; width: 1280px; height: 720px; overflow: hidden; }
  iframe { position: absolute; border: 0; display: block; background: #0b1020; }
</style>
</head>
<body>
<section>
  <iframe id="inst" data-instance="motion-enter" src="../motion/enter.html" at="0" scrolling="no" style="left:0;top:0;width:1280px;height:720px"></iframe>
</section>
<script>
(() => {
  'use strict';
  // 舞台要求 window.film.frame(t) 存在；摆放与相位都不在这里做。
  window.film = {
    meta: { width: 1280, height: 720, duration: 8 },
    async ready() { document.body.dataset.filmReady = '1'; },
    async frame(t) { document.body.dataset.filmFrame = String(t); }
  };
})();
</script>
</body>
</html>
