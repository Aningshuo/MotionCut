<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>M33-A7 场景：同源模板实例 + 一个跨源 iframe</title>
<!--
  - #inst：同源模板实例（data-instance + at），--motion-t 会写到它和它里面的模板文档
  - #ad：**跨源** iframe（__CROSS_ORIGIN__ 由验收脚本替换）——舞台进不去，
          writeMotionTime 计入 crossOrigin 并跳过，不抛、不影响这一帧
-->
<style>
  html, body { margin: 0; padding: 0; background: #0b1020; }
  section { position: relative; display: block; width: 1280px; height: 720px; overflow: hidden; }
  iframe { position: absolute; border: 0; display: block; background: #0b1020; }
  #ad { left: 900px; top: 560px; width: 320px; height: 120px; }
</style>
</head>
<body>
<section>
  <iframe id="inst" data-instance="motion-enter" src="../motion/enter.html" at="0" scrolling="no" style="left:0;top:0;width:1280px;height:720px"></iframe>
  <iframe id="ad" src="__CROSS_ORIGIN__" at="0" scrolling="no"></iframe>
</section>
<script>
(() => {
  'use strict';
  window.film = {
    meta: { width: 1280, height: 720, duration: 3 },
    async ready() { document.body.dataset.filmReady = '1'; },
    async frame(t) { document.body.dataset.filmFrame = String(t); }
  };
})();
</script>
</body>
</html>
