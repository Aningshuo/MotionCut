<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>M30 场景：模板的源文件（也是片段直接渲染的那份）</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f14; font-family: -apple-system, "PingFang SC", Arial, sans-serif; }
  .card {
    position: absolute; left: 120px; top: 120px; width: 1040px; height: 480px;
    border-radius: 24px; padding: 40px; background: #101a24;
    border: 3px solid var(--accent, #3b82f6);
    box-shadow: 0 0 0 calc(var(--speed, 1) * 4px) rgba(59, 130, 246, 0.28);
  }
  #ver { margin: 0 0 10px; font-size: 44px; color: #f8fafc; }
  p { margin: 0; font-size: 18px; color: #94a3b8; }
</style>
</head>
<body>
<div class="card" data-instance="mm-card">
  <h1 id="ver">v1</h1>
  <p>模板源：motion/library.json 里的 base-card；升级会把它记成 v2，回退把这一行改回 v1</p>
</div>
<script type="module">
  window.film = {
    duration: 6,
    ready() { return Promise.resolve(); },
    frame() { return Promise.resolve(); }
  };
</script>
</body>
</html>
