<style>
  html, body { margin: 0; height: 100%; background: #000; }
</style>
</head>
<body>

  <video id="pic" src="assets/pic.mp4#t=0,3" at="0" muted></video>
</section>
<section id="sound">
  <audio id="snd-a" src="assets/tone.wav#t=0,3" at="0" volume="0.8"></audio>
  <audio id="snd-b" src="assets/tone.wav#t=0,3" at="3" volume="0.4"></audio>
  <audio id="snd-c" src="assets/tone.wav#t=0,3" at="6" volume="0.8"></audio>
