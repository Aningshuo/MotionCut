<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>动效模板源：弹入卡片</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #0b0f14; }
  .pop {
    position: absolute; left: 120px; top: 120px; width: 1040px; height: 480px;
    border-radius: 24px; background: #101a24; border: 3px solid var(--accent, #3b82f6);
    animation: pop-in calc(var(--speed, 1) * 0.4s) cubic-bezier(.2, 1.4, .4, 1) both;
  }
  @keyframes pop-in { from { transform: scale(0.86); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div class="pop" data-instance="m-card"><h1 style="color:#fff;margin:40px;font-size:56px">动效标题</h1></div>
</body>
</html>
