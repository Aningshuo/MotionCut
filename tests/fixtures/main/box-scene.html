<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>M15 夹具场景：一层可改几何的网页</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101820; font-family: -apple-system, "PingFang SC", Arial, sans-serif; }
  .panel { position: absolute; left: 64px; top: 56px; width: 1100px; height: 600px; padding: 48px; background: #f6f4ec; border-radius: 24px; }
  .tag { display: inline-block; font-size: 18px; letter-spacing: 0.12em; color: #fff; background: #2d6f8f; border-radius: 999px; padding: 7px 16px; }
  h1 { margin: 18px 0 10px; font-size: 64px; color: #16303d; }
  p { margin: 0 0 24px; font-size: 24px; color: #5a666e; }
  .row { display: flex; gap: 26px; }
  .block { width: 190px; height: 150px; border-radius: 14px; background: linear-gradient(180deg, #59a7c4, #2d6f8f); }
  .block.b { opacity: 0.7; }
  .block.c { opacity: 0.45; }
</style>
</head>
<body>
<div class="panel" id="panel">
  <span class="tag" id="tag">BOX</span>
  <h1 id="title">几何夹具</h1>
  <p id="subtitle">改 X 会把整段网页往右挪 30px</p>
  <div class="row" id="row">
    <div class="block a" id="block-a"></div>
    <div class="block b" id="block-b"></div>
    <div class="block c" id="block-c"></div>
  </div>
</div>
<script type="module">
  const blocks = [document.querySelector('#block-a'), document.querySelector('#block-b'), document.querySelector('#block-c')];
  window.film = {
    duration: 8,
    ready() { return Promise.resolve(); },
    frame(t) {
      const q = Math.max(0, Math.min(1, Number(t) / 8));
      blocks.forEach((el, i) => { el.style.height = (110 + (i + 1) * 20 + 60 * q) + 'px'; });
      return Promise.resolve();
    }
  };
</script>
</body>
</html>
