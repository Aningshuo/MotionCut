<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>隔离探针：影片脚本不该能调 Studio 写接口</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #071018; color: #cfe1ff; font-family: -apple-system, "PingFang SC", Arial, sans-serif; }
  .stage { display: grid; place-items: center; height: 100%; }
  .box { text-align: center; }
  h1 { margin: 0 0 10px; font-size: 46px; }
  p { margin: 0; font-size: 22px; color: #7f93a8; }
</style>
</head>
<body>
<div class="stage">
  <div class="box">
    <h1 id="title">隔离探针</h1>
    <p id="note">尝试访问 Studio 的 /api，结果写入 window.__isolation</p>
  </div>
</div>
<script type="module">
  const result = { state: 'waiting', studio: '', attempts: [], done: false };
  window.__isolation = result;
  window.film = { duration: 8, ready() { return Promise.resolve(); }, frame() { return Promise.resolve(); } };

  function studioOrigin() {
    try {
      if (window.parent && window.parent.parent && window.parent.parent.__stageStudioOrigin) {
        return String(window.parent.parent.__stageStudioOrigin);
      }
    } catch (error) {
      return '';
    }
    return '';
  }

  async function probe() {
    const studio = studioOrigin();
    result.studio = studio;
    if (studio === '') {
      result.state = 'no-studio-origin';
      result.done = true;
      return;
    }
    result.state = 'running';
    try {
      const response = await fetch(studio + '/api/projects', { cache: 'no-store' });
      result.attempts.push({ kind: 'get-projects', status: response.status, ok: response.ok });
    } catch (error) {
      result.attempts.push({ kind: 'get-projects', error: String(error && error.message ? error.message : error) });
    }
    try {
      const response = await fetch(studio + '/api/projects/0000000000000000/ops', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ envelope: { projectId: '0000000000000000' }, ops: [{ op: 'stage', w: 640, h: 360 }] })
      });
      result.attempts.push({ kind: 'post-ops-json', status: response.status, ok: response.ok });
    } catch (error) {
      result.attempts.push({ kind: 'post-ops-json', error: String(error && error.message ? error.message : error) });
    }
    try {
      const response = await fetch(studio + '/api/projects', { method: 'POST', mode: 'no-cors', body: '{}' });
      result.attempts.push({ kind: 'post-no-cors', status: response.status, type: response.type });
    } catch (error) {
      result.attempts.push({ kind: 'post-no-cors', error: String(error && error.message ? error.message : error) });
    }
    const note = document.querySelector('#note');
    if (note) note.textContent = 'attempts=' + result.attempts.length;
    result.state = 'done';
    result.done = true;
  }

  let tries = 0;
  const timer = setInterval(() => {
    tries += 1;
    if (studioOrigin() !== '' || tries > 40) {
      clearInterval(timer);
      probe();
    }
  }, 100);
</script>
</body>
</html>
