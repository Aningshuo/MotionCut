<!doctype html>
<html lang="zh-CN">
<head>

  .sub { position: absolute; color: #94a3b8; font: 400 14px/1.5 "PingFang SC", Arial; }

<div class="wrap">
  <div id="stage">
    <div class="card" data-card="a" style="left:60px;top:70px;width:300px;height:180px;background:linear-gradient(135deg,#3b82f6,#8b5cf6)"></div>

    <div class="sub" style="left:420px;top:150px">panel.mjs · 纯 UI + 校验</div>
