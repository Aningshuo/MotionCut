<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图层树夹具</title>
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #eef1f6; }
  body { font-family: "PingFang SC", "Hiragino Sans GB", Arial, sans-serif; }
  .stage { position: relative; width: 1280px; height: 720px; }
  .board { position: absolute; left: 60px; top: 44px; width: 1160px; height: 632px; background: #fbf9f3; border-radius: 20px; box-shadow: 0 10px 40px #0f172933; }
  .card { position: absolute; left: 48px; top: 52px; width: 660px; height: 210px; background: #ffffff; border: 1px solid #dfe4ec; border-radius: 14px; padding: 28px 32px; }
  .label { display: inline-block; font-size: 40px; font-weight: 700; color: #1d4ed8; letter-spacing: 1px; }
  .sub { display: block; margin-top: 12px; font-size: 20px; color: #4b5563; }
  .note { position: absolute; left: 48px; top: 300px; width: 660px; margin: 0; font-size: 18px; color: #6b7280; }
  .locked-card { position: absolute; left: 48px; top: 380px; width: 660px; height: 120px; background: #f3f4f6; border: 1px dashed #9ca3af; border-radius: 14px; padding: 24px 32px; font-size: 20px; color: #4b5563; }
  .badge { position: absolute; right: 48px; top: 52px; padding: 10px 18px; border-radius: 999px; background: #e8eefc; color: #1e40af; font-size: 18px; }
  .foot { position: absolute; right: 48px; bottom: 44px; font-size: 16px; color: #6b7280; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <section class="board" id="sec">
      <div class="card" id="box">
        <span class="label" id="label">三层嵌套标题</span>
        <span class="sub" id="sub">section &gt; div &gt; span：父级折叠时整块收起</span>
      </div>
      <p class="note" id="note">这行是 div 的兄弟：折叠 section 会一起收起来，折叠 div 不受影响</p>
      <div class="locked-card" id="locked-card" data-name="锁定卡片">锁定层：点我不该被选中（只显示锁标记）</div>
      <div class="badge" id="badge">独立徽标</div>
      <div class="foot" id="foot">保留源码 · 可撤销</div>
    </section>
  </div>
</body>
</html>
