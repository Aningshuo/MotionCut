<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>变换合成夹具 · 场景 transform × 覆盖 scale/rotate</title>
<style>
  html, body { margin: 0; width: 640px; height: 360px; background: #0b1020; color: #eef2ff;
    font-family: system-ui, "PingFang SC", sans-serif; overflow: hidden; }
  /* 场景自己在 frame(t) 里写 transform 的层 */
  #card { position: absolute; left: 40px; top: 40px; width: 100px; height: 100px;
    background: #ff2d55; border-radius: 8px; }
  /* 场景没有 transform 的层（A4：与旧行为一致） */
  #plain { position: absolute; left: 40px; top: 200px; width: 100px; height: 100px;
    background: #3ddc97; border-radius: 8px; }
  /* 场景自己占用 scale（A5：必须拒绝，不能盖） */
  #scene-scale { position: absolute; left: 260px; top: 200px; width: 80px; height: 80px;
    background: #ffd166; }
  #label { position: absolute; left: 260px; top: 40px; font-size: 22px; }
  #tag { position: absolute; left: 260px; top: 90px; font-size: 14px; color: rgb(143, 163, 200); }
  #flow { position: absolute; left: 40px; top: 320px; font-size: 16px; margin: 0; }
</style>
</head>
<body>
  <div id="card"></div>
  <div id="plain"></div>
  <div id="scene-scale" style="scale: 1.1"></div>
  <div id="label">标题</div>
  <div id="tag">标签</div>
  <p id="flow">一段 <span id="inline-word">行内</span> 文字</p>
<script>
(() => {
  'use strict';
  const card = document.getElementById('card');

  // 只由 t 决定，不读上一帧状态：场景拥有 transform（translate + scale），
  // 覆盖拥有 scale/rotate 个体属性——两者必须同时出现在合成矩阵里。
  window.film = {
    meta: { width: 640, height: 360, duration: 3 },
    async ready() {
      document.body.dataset.filmReady = '1';
    },
    async frame(t) {
      card.style.transform = 'translateX(' + (20 + 30 * t) + 'px) scale(' + (1 + 0.2 * t) + ')';
      document.body.dataset.filmFrame = String(t);
    }
  };
})();
</script>
</body>
</html>
