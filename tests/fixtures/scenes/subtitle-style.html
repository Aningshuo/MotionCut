<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>字幕样式验收夹具 · S41</title>
<style>
  html, body { margin: 0; padding: 0; background: #05080f; }
  /* 取景框：1280×720 的舞台放在 1440×820 的框里，四周留一点边方便看安全区 */
  #crop {
    position: relative;
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: #04070d;
  }
  /*
   * 舞台：真画面。故意做成「上暗下亮的斜向渐变 + 一块高亮牌」——
   * 白字在亮底上有没有描边，一眼就能看出来（A3 的截图判据）。
   */
  #stage {
    position: relative;
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background:
      radial-gradient(900px 520px at 78% 82%, #ffd9a0 0%, rgba(255,217,160,0) 62%),
      linear-gradient(155deg, #0a1424 0%, #12294a 46%, #e8c894 100%);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120,170,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,170,255,0.06) 1px, transparent 1px);
    background-size: 64px 64px;
  }
  /* 高亮牌：白字描边/字号的对照背景（越亮越吃描边） */
  .plate {
    position: absolute; left: 120px; right: 120px; bottom: 90px; height: 210px;
    border-radius: 18px;
    background: linear-gradient(120deg, #fff4d6 0%, #ffd76e 52%, #ffb347 100%);
    box-shadow: 0 18px 60px rgba(0,0,0,0.35) inset;
  }
  .title {
    position: absolute; left: 90px; top: 120px;
    font-size: 60px; font-weight: 700; letter-spacing: 2px; color: #eaf2ff;
    text-shadow: 0 6px 30px rgba(0,0,0,0.55);
  }
  .cap {
    position: absolute; right: 48px; top: 36px;
    font: 15px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: rgba(200,220,255,0.6);
  }
</style>
</head>
<body>
  <div id="crop">
    <div id="stage">
      <div class="grid"></div>
      <div class="plate"></div>
      <div class="title">字幕样式验收</div>
      <div class="cap">S41 · 1280×720 stage</div>
    </div>
  </div>
</body>
</html>
