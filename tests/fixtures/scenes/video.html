<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>sub1 video scene</title>
<style>
  html, body { margin: 0; padding: 0; width: 640px; height: 360px; overflow: hidden; background: #05070c; }
  #wrap { position: absolute; left: 40px; top: 40px; width: 560px; height: 280px; display: flex; align-items: center; justify-content: center; }
  video { width: 560px; height: 315px; object-fit: cover; }
</style>
</head>
<body>
<div id="wrap"><video id="v" src="/tests/fixtures/scenes/media/clip.webm" muted playsinline preload="auto"></video></div>
<script>
(() => {
  'use strict';
  const v = document.getElementById('v');
  let shots = 0;

  function seekTo(t) {
    return new Promise((resolve, reject) => {
      const target = Math.max(0, Math.min(t, Math.max(0, (v.duration || 2) - 0.04)));
      if (Math.abs(v.currentTime - target) < 1e-6 && v.readyState >= 2 && !v.seeking) {
        // 已经在目标时间：不再触发 seek，直接完成。
        resolve();
        return;
      }
      const timer = setTimeout(() => reject(new Error('scene seek timeout at t=' + t)), 4000);
      v.addEventListener('seeked', () => {
        clearTimeout(timer);
        resolve();
      }, { once: true });
      v.currentTime = target;
    });
  }

  window.film = {
    meta: { width: 640, height: 360, duration: 2 },
    async ready() {
      if (v.readyState >= 2) { document.body.dataset.filmReady = '1'; return; }
      await new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('video resource timeout')), 4000);
        v.addEventListener('loadeddata', () => { clearTimeout(timer); resolve(); }, { once: true });
        v.addEventListener('error', () => {
          clearTimeout(timer);
          reject(new Error('video failed: ' + (v.error ? v.error.message : 'unknown')));
        }, { once: true });
      });
      document.body.dataset.filmReady = '1';
    },
    /**
     * 场景自身先 await seeked 再返回 —— 这正是 S7 要证明的形态：
     * 宿主若先 await frame() 再无条件等 seeked，事件已经被消费，必然卡住。
     */
    async frame(t) {
      shots += 1;
      await seekTo(t);
      document.body.dataset.filmFrame = String(t);
      document.body.dataset.filmShots = String(shots);
    }
  };
})();
</script>
</body>
</html>
