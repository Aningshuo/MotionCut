<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>动效取帧夹具 · 两个实例（at 差 400ms）</title>
<!--
  S33 取帧夹具：两个 pulse 实例并排，at=0 / at=0.4
  clip 用 film.html 已有的表达——<iframe> + at 属性（contracts/film-doc.ts 的 Clip.at），
  data-instance 就是 instantiate() 产出的实例根挂载点。
  这个页面**不含动效逻辑**：相位全靠 SceneHost.frame(t) 写进来的 --motion-t。
-->
<style>
  html, body { margin: 0; padding: 0; background: #0f1729; }
  section { position: relative; display: block; width: 1280px; height: 720px; overflow: hidden; }
  iframe { position: absolute; border: 0; display: block; background: #070b14; }
</style>
</head>
<body>
<section>
  <!-- 左：at=0；右：at=0.4。同一个 t 下两者相差 400ms 相位，互不影响。 -->
  <iframe id="a" data-instance="clip-pulse-a" src="../../../packages/motion/templates/pulse/pulse.html" at="0" scrolling="no" style="left:0;top:0;width:640px;height:720px"></iframe>
  <iframe id="b" data-instance="clip-pulse-b" src="../../../packages/motion/templates/pulse/pulse.html" at="0.4" scrolling="no" style="left:640px;top:0;width:640px;height:720px"></iframe>
</section>
<script>
(() => {
  'use strict';
  // SceneHost 要求 window.film.frame(t) 存在；摆放与相位都不在这里做。
  window.film = {
    meta: { width: 1280, height: 720, duration: 3 },
    async ready() { document.body.dataset.filmReady = '1'; },
    async frame(t) { document.body.dataset.filmFrame = String(t); }
  };
})();
</script>
</body>
</html>
