<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>R25 场景 B：三根柱子</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #241a10; font-family: -apple-system, "PingFang SC", Arial, sans-serif; }
  .wrap { position: relative; width: 100%; height: 100%; }
  .panel { position: absolute; left: 6%; top: 16%; width: 88%; height: 68%; padding: 5% 6%; background: #fdf6e3; border-radius: 24px; }
  .tag { display: inline-block; font-size: 18px; letter-spacing: 0.12em; color: #fff; background: #9a5b1d; border-radius: 999px; padding: 8px 18px; }
  h1 { margin: 3% 0 3%; font-size: 64px; color: #4a2d0e; }
  .chart { display: flex; align-items: flex-end; gap: 40px; height: 240px; }
  .bar { width: 140px; background: linear-gradient(180deg, #d99a3f, #9a5b1d); border-radius: 12px 12px 0 0; height: 20px; }
  .clock { position: absolute; right: 6%; top: 4%; font: 22px/1 ui-monospace, Menlo, monospace; color: #7d6a52; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <span class="tag">SCENE B</span>
    <h1 id="title">第二段网页</h1>
    <div class="chart">
      <div class="bar" id="bar-one"></div>
      <div class="bar" id="bar-two"></div>
      <div class="bar" id="bar-three"></div>
    </div>
    <div class="clock" id="clock">t=0.00</div>
  </div>
</div>
<script>
  var bars = [document.getElementById('bar-one'), document.getElementById('bar-two'), document.getElementById('bar-three')];
  var clock = document.getElementById('clock');
  window.film = {
    duration: 4,
    // 异步 frame()：另一种写法，证明两条路都吃得住
    frame: function (t) {
      var q = Math.max(0, Math.min(1, Number(t) / 4));
      bars.forEach(function (el, i) {
        el.style.height = (20 + (i + 1) * 34 + 90 * q).toFixed(1) + 'px';
      });
      clock.textContent = 't=' + Number(t).toFixed(2);
      return Promise.resolve();
    }
  };
</script>
</body>
</html>
